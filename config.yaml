log_file: sample_logs/auth.log
year: 2026

brute_force:
  threshold: 5          # failures needed before we care
  window_seconds: 60    # ...within this many seconds

user_spraying:
  threshold: 5          # different usernames from one IP...
  window_seconds: 300   # ...within this many secondsa

distributed_attack:
  threshold: 5          # different IPs against one username...
  window_seconds: 300   # ...within this many seconds

# IPs the detector should ignore (trusted scanners, monitoring, etc.)
allowlist_ips:
  - 10.0.0.99
  - 192.0.2.44